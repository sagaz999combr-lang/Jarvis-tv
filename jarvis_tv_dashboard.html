<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS // Interface</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#bcefff;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 50% 46%,#08233a 0%,#04111f 35%,#020711 72%);text-shadow:0 0 10px rgba(0,190,255,.25)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,170,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.055) 1px,transparent 1px);background-size:42px 42px;opacity:.42}
.top{position:absolute;left:4%;right:4%;top:4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #14628a;padding-bottom:14px;letter-spacing:3px;font-size:clamp(12px,1.4vw,19px)}
.small{font-size:clamp(9px,.9vw,13px);color:#5fbedf;letter-spacing:2px}
.core{position:absolute;width:min(40vw,55vh);height:min(40vw,55vh);left:50%;top:48%;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border:1px solid rgba(32,200,255,.75);border-radius:50%;inset:0;box-shadow:0 0 24px rgba(0,170,255,.12),inset 0 0 24px rgba(0,170,255,.08)}
.r2{inset:8%;border-style:dashed;opacity:.75;animation:spin 28s linear infinite}
.r3{inset:17%;border-width:2px;opacity:.5;animation:spin 18s linear infinite reverse}
.r4{inset:27%;border-color:#54eaff;box-shadow:0 0 35px #008fbe,inset 0 0 25px rgba(0,210,255,.25)}
.core:before{content:"";position:absolute;width:40%;height:40%;border-radius:50%;background:radial-gradient(circle,#e6ffff 0%,#57eaff 9%,#0078ba 32%,rgba(0,120,190,.18) 68%,transparent 72%);box-shadow:0 0 55px #00aaff;animation:pulse 3s ease-in-out infinite}
.core:after{content:"";position:absolute;width:64%;height:1px;background:#50e9ff;box-shadow:0 0 15px #00cfff;transform:rotate(-32deg)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.72}}
.panel{position:absolute;border:1px solid rgba(34,190,255,.48);background:rgba(3,20,36,.55);padding:15px 18px;min-width:19%;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.p1{left:4%;top:24%}.p2{right:4%;top:24%}.p3{left:4%;bottom:10%}.p4{right:4%;bottom:10%}
.label{font-size:clamp(10px,1vw,14px);letter-spacing:2px;color:#55dfff;margin-bottom:12px}
.value{font-size:clamp(17px,2.2vw,30px);letter-spacing:2px;color:#e1fbff}
.sub{font-size:clamp(9px,.9vw,12px);color:#64a9c4;margin-top:8px;letter-spacing:1px}
.bars{display:flex;align-items:end;gap:4px;height:45px;margin-top:10px}
.bars i{display:block;width:7%;background:#1bcaff;box-shadow:0 0 9px #008dce;animation:bars 1.1s ease-in-out infinite alternate}
.bars i:nth-child(2n){animation-delay:.2s}.bars i:nth-child(3n){animation-delay:.4s}
@keyframes bars{from{height:15%}to{height:90%}}
.bottom{position:absolute;bottom:3%;left:4%;right:4%;display:flex;justify-content:space-between;gap:10px;color:#3985a5;font-size:clamp(8px,.8vw,11px);letter-spacing:2px}
.status{color:#7df6ff}
@media(max-width:700px){.panel{min-width:25%;padding:9px}.p1,.p3{left:2%}.p2,.p4{right:2%}.core{width:46vw;height:46vw}.top{left:2%;right:2%}}
</style>
</head>
<body>
<div id="grid"></div>
<div class="top"><div>J.A.R.V.I.S <span class="small">// SISTEMA DE ASSISTÊNCIA</span></div><div class="status">● ONLINE</div></div>
<div class="panel p1"><div class="label">SISTEMA</div><div class="value">OPERACIONAL</div><div class="sub">INTERFACE PRINCIPAL</div></div>
<div class="panel p2"><div class="label">HORA LOCAL</div><div class="value" id="clock">--:--:--</div><div class="sub" id="date">INICIALIZANDO</div></div>
<div class="core"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div></div>
<div class="panel p3"><div class="label">ANÁLISE DE SINAL</div><div class="value">ESTÁVEL</div><div class="bars"><i style="height:35%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:85%"></i><i style="height:30%"></i><i style="height:60%"></i><i style="height:95%"></i><i style="height:50%"></i><i style="height:75%"></i><i style="height:40%"></i><i style="height:65%"></i></div></div>
<div class="panel p4"><div class="label">MÓDULOS</div><div class="value">04 / 04</div><div class="sub">VISUAL • RELÓGIO • HUD • STATUS</div></div>
<div class="bottom"><span>JARVIS UI // BUILD 01</span><span>CONEXÃO IA: NÃO CONFIGURADA</span><span>WEBOS 3.x READY</span></div>
<script>
function updateClock(){
 var d=new Date(), pad=function(n){return n<10?'0'+n:n;};
 document.getElementById('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
 var days=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'], months=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
 document.getElementById('date').innerHTML=days[d.getDay()]+' // '+pad(d.getDate())+' '+months[d.getMonth()]+' '+d.getFullYear();
}
updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
